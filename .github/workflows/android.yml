name: Android CI/CD

on:
  push:
    branches: [ "latest" ]
  pull_request:
    branches: [ "latest" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest Tests
        run: npm test

  build-android:
    name: Build Android
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build Release Bundle (AAB)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/latest') || github.event_name == 'workflow_dispatch'
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon || echo "Release bundle failed - likely missing keystore"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release Bundle (AAB)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/latest') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

  publish-to-play-store:
    name: Publish to Play Store
    needs: build-android
    if: (github.event_name == 'push' && github.ref == 'refs/heads/latest') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Release Bundle
        uses: actions/download-artifact@v4
        with:
          name: app-release-bundle

      - name: Upload to Google Play (Internal Sharing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonRaw: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.officekitlence
          releaseFiles: app-release.aab
          track: internal
          status: completed
